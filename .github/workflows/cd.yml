on:
  push:
    branches: [main]
jobs: 
   deploy:
     name: Deploy
     runs-on: ubuntu-latest

     steps:
       - name: check out code
         uses: actions/checkout@v6
       
       - name: install dependencies
         run: npm ci

       - name: set up nodejs
         run: actions/setup-node@v3

       - name: build app
         run: npm run build 
